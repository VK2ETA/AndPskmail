apply plugin: 'com.android.application'

android {
    namespace 'com.AndPskmail'
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    compileSdkVersion 35
    defaultConfig {
        applicationId "com.AndPskmail"
        minSdkVersion 26
        targetSdkVersion 35
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
        debug {
            jniDebuggable true
        }
    }
    productFlavors {
    }
}

configurations.all {
    resolutionStrategy {
        // Since Kotlin 1.8, jdk7 and jdk8 stdlib variants were merged into
        // kotlin-stdlib. Force all three to the same version to eliminate
        // duplicate class errors from transitive dependencies pulling older jars.
        force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
    }
}

dependencies {
    implementation files('libs/acra-4.5.0.jar')
    implementation 'com.github.mik3y:usb-serial-for-android:3.7.0'
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation "androidx.preference:preference:1.2.1"
}
